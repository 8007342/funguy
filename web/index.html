<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173d36">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FunGuy — a little closer to nature. An offline mushroom field companion.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FunGuy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FunGuy · Wild discoveries</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <style>body { margin: 0; background: #f7f4ea; } #loading { height: 100vh; display: grid; place-content: center; color: #173d36; text-align: center; font-family: Georgia, serif; } #loading h1 { font-size: 48px; margin-bottom: 12px; } #loading p { font: 14px system-ui; }</style>
  <div id="loading"><h1>FunGuy</h1><p>A little closer to nature.</p></div>
  <script>window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn)); }</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
